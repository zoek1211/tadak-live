<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${live.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container watch">
    <section class="watch-main" aria-label="방송">
        <div class="stage">
            <video id="player" th:if="${live.onAir}" autoplay playsinline controls></video>
            <p class="stage-note" id="status" th:if="${live.onAir}">방송 연결 중...</p>
            <p class="stage-note" id="ended-view" th:attr="hidden=${live.onAir} ? 'hidden' : null">불이 꺼졌어요. 불씨만 남았어요.</p>
            <span class="badge stage-badge" id="status-badge" th:classappend="${live.onAir} ? 'badge-live' : 'badge-ended'">
                <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 3.2-1.6 4.8-1.6 7.6 0 1.4 1 2.4 2.2 2.4 1.4 0 2.2-1.1 2-2.9 2.3 1.7 3.4 4.1 3.4 6.4A6 6 0 0 1 12 21.5a6 6 0 0 1-6-6c0-4.6 4.6-7.2 6-13.5Z" fill="currentColor"/></svg>
                <span id="status-label" th:text="${live.status.label}">타는 중</span>
            </span>
            <button type="button" class="button stage-button" id="unmute-button" th:if="${live.onAir}" hidden>소리 켜기</button>
        </div>

        <div class="watch-head">
            <div>
                <h1 th:text="${live.title}">제목</h1>
                <p class="meta">
                    <span th:text="${live.owner != null} ? ${live.owner.nickname} : '소유자 없음'">닉네임</span>
                    ·
                    <time th:text="${#temporals.format(live.startedAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul')}">2026-01-01</time>에 불을 피움
                    <th:block th:if="${live.endedAt != null}">
                        ·
                        <time th:text="${#temporals.format(live.endedAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul')}">2026-01-01</time>에 꺼짐
                    </th:block>
                    <th:block th:if="${live.onAir}">
                        · <span th:text="'불가에 ' + ${@liveAudience.count(live.id)} + '명'">불가에 0명</span>
                    </th:block>
                </p>
            </div>
            <span class="seat-chip" th:if="${live.onAir}"
                  th:text="'자리 ' + ${@liveAudience.capacity()} + '석 중 ' + ${@liveAudience.count(live.id)} + '석'">자리 5석 중 0석</span>
        </div>

        <div class="owner-actions" th:if="${currentMember != null and live.isOwnedBy(currentMember.memberId())}">
            <button type="button" class="button button-secondary" id="owner-end-button" th:if="${live.onAir}">불 끄기</button>
            <form method="post" th:action="@{/live/{id}/delete(id=${live.id})}" th:unless="${live.onAir}">
                <button type="submit" class="button button-secondary">삭제</button>
            </form>
        </div>

        <section th:replace="~{fragments/donations :: donations(${donationLiveKind}, ${live.id})}"></section>
        <p><a th:href="@{/broadcasts}">← 목록으로</a></p>
    </section>
    <section th:replace="~{fragments/comments :: comments(${liveKind}, ${live.id})}"></section>
</main>
<script th:if="${live.onAir and currentMember != null and live.isOwnedBy(currentMember.memberId())}">
(function () {
    // 소유자는 어느 기기에서든 자기 라이브를 종료할 수 있다. 화면 전환은 시청자 연결이 받는 종료 알림이 맡는다.
    var button = document.getElementById('owner-end-button');
    var token = document.querySelector('meta[name="_csrf"]');
    var name = document.querySelector('meta[name="_csrf_header"]');
    button.addEventListener('click', function () {
        var headers = {};
        if (token && name) { headers[name.content] = token.content; }
        button.disabled = true;
        fetch(location.pathname + '/end', { method: 'POST', headers: headers }).then(function (response) {
            if (response.ok) {
                button.hidden = true;
            } else {
                button.disabled = false;
            }
        }).catch(function () { button.disabled = false; });
    });
})();
</script>
<script th:if="${live.onAir}" th:inline="javascript">
(function () {
    var liveId = /*[[${live.id}]]*/ 0;
    var iceServers = JSON.parse(/*[[${iceServersJson}]]*/ '[]');
    var player = document.getElementById('player');
    var status = document.getElementById('status');
    var scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var unmuteButton = document.getElementById('unmute-button');
    var ws = null;
    var pc = null;
    var retired = [];
    var attempts = 0;
    var retryTimer = null;
    // 방송이 끝났거나 정원이 찼으면 더는 연결이 끊긴 것으로 보지 않는다.
    var settled = false;

    function send(payload) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(payload));
        }
    }

    unmuteButton.addEventListener('click', function () {
        player.muted = false;
        unmuteButton.hidden = true;
    });
    player.addEventListener('volumechange', function () {
        if (!player.muted) { unmuteButton.hidden = true; }
    });

    function stopPlayback() {
        player.pause();
        player.srcObject = null;
        retired.concat(pc ? [pc] : []).forEach(function (old) { old.close(); });
        retired = [];
    }

    // 방송이 끝나면 새로고침 없이 영상을 멈추고 종료 안내로 바꾼다.
    function showEnded() {
        settled = true;
        clearTimeout(retryTimer);
        stopPlayback();
        player.hidden = true;
        unmuteButton.hidden = true;
        status.hidden = true;
        var badge = document.getElementById('status-badge');
        document.getElementById('status-label').textContent = '불 꺼짐';
        badge.classList.remove('badge-live');
        badge.classList.add('badge-ended');
        document.getElementById('ended-view').hidden = false;
    }

    // 다시 접속하지 못하고 포기할 때 알리고 새로고침하도록 안내한다.
    function showDisconnected() {
        if (settled) { return; }
        settled = true;
        stopPlayback();
        status.textContent = '연결이 끊어졌습니다. 페이지를 새로고침해(다시 연결) 주세요.';
        status.hidden = false;
    }

    // 브라우저는 WebSocket 핸드셰이크의 거절 이유를 볼 수 없으므로, 다시 접속하기 전에 방송 상태 엔드포인트로 종료 여부를 확인한다.
    // 확인이 실패하면(네트워크 오류 등) 종료가 아닌 것으로 보고 계속 재시도하되, 재시도는 20번까지만 한다(아래 reconnect).
    function fetchEnded() {
        return fetch('/live/' + liveId + '/status', { credentials: 'same-origin' }).then(function (response) {
            return response.ok ? response.json() : null;
        }).then(function (state) {
            return !!state && state.onAir === false;
        }).catch(function () { return false; });
    }

    // ended 없이 연결이 끊기면(서버 인스턴스 교체 등) 다시 접속해 처음부터 협상한다. 재생 중인 영상은 새 영상이 올 때까지 둔다.
    function reconnect() {
        if (settled) { return; }
        attempts += 1;
        if (attempts > 20) {
            showDisconnected();
            return;
        }
        if (!player.srcObject) {
            status.textContent = '방송 연결 중...';
            status.hidden = false;
        }
        fetchEnded().then(function (ended) {
            if (settled) { return; }
            if (ended) {
                showEnded();
                return;
            }
            retryTimer = setTimeout(connect, Math.min(1000 * Math.pow(2, attempts - 1), 5000));
        });
    }

    function connect() {
        if (settled) { return; }
        var socket = new WebSocket(scheme + '//' + location.host + '/ws/live/' + liveId + '/viewer');
        var connection = new RTCPeerConnection({ iceServers: iceServers });
        if (pc) { retired.push(pc); }
        ws = socket;
        pc = connection;

        connection.onicecandidate = function (event) {
            if (event.candidate && pc === connection) {
                send({ type: 'candidate', candidate: event.candidate });
            }
        };
        connection.ontrack = function (event) {
            if (pc !== connection) { return; }
            player.srcObject = event.streams[0];
            retired.forEach(function (old) { old.close(); });
            retired = [];
            status.hidden = true;
            // 자동 재생이 막히면 음소거로 시작한다. 컨트롤로 음소거를 해제할 수 있다.
            player.play().catch(function () {
                player.muted = true;
                player.play();
                unmuteButton.hidden = false;
            });
        };
        ws.onclose = function () {
            if (socket === ws) { reconnect(); }
        };
        ws.onerror = function () { socket.close(); }; // 닫힘 처리는 onclose가 한다

        // 메시지를 순서대로 처리한다(offer 처리 전에 candidate가 앞지르지 않도록).
        var queue = Promise.resolve();
        socket.onmessage = function (event) {
            var msg = JSON.parse(event.data);
            if (msg.type === 'full') {
                settled = true;
                status.textContent = '자리가 다 찼어요';
                status.hidden = false;
                return;
            }
            if (msg.type === 'ended') {
                showEnded();
                return;
            }
            queue = queue.then(function () {
                if (msg.type === 'offer') {
                    attempts = 0;
                    return connection.setRemoteDescription({ type: 'offer', sdp: msg.sdp }).then(function () {
                        return connection.createAnswer();
                    }).then(function (answer) {
                        return connection.setLocalDescription(answer);
                    }).then(function () {
                        send({ type: 'answer', sdp: connection.localDescription.sdp });
                    });
                } else if (msg.type === 'candidate') {
                    return connection.addIceCandidate(msg.candidate);
                }
            }).catch(function (e) { console.warn(e); });
        };
    }

    connect();
})();
</script>
</body>
</html>
