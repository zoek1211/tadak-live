<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:text="${title} + ' · 타닥 라이브'">타닥 라이브</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
</head>
<body>
<header th:fragment="header" class="site-header">
    <a class="brand" th:href="@{/broadcasts}">
        <svg class="brand-mark" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 3.2-1.6 4.8-1.6 7.6 0 1.4 1 2.4 2.2 2.4 1.4 0 2.2-1.1 2-2.9 2.3 1.7 3.4 4.1 3.4 6.4A6 6 0 0 1 12 21.5a6 6 0 0 1-6-6c0-4.6 4.6-7.2 6-13.5Z" fill="currentColor"/><ellipse cx="10" cy="16" rx="1" ry="1.3" fill="var(--bg)"/><ellipse cx="14" cy="16" rx="1" ry="1.3" fill="var(--bg)"/><circle cx="10.35" cy="15.45" r=".38" fill="#fff"/><circle cx="14.35" cy="15.45" r=".38" fill="#fff"/><ellipse cx="8.25" cy="18.25" rx="1.1" ry=".65" fill="#ffc56b"/><ellipse cx="15.75" cy="18.25" rx="1.1" ry=".65" fill="#ffc56b"/></svg>
        타닥 <span>라이브</span>
    </a>
    <nav class="header-actions" aria-label="주요 메뉴">
        <a class="button" th:href="@{/live/new}">불 피우기</a>
        <a class="button button-secondary" th:href="@{/broadcasts/new}">다시 보기 올리기</a>
        <th:block th:if="${currentMember == null}">
            <a class="button button-ghost" th:href="@{/login}">로그인</a>
            <a class="button button-ghost" th:href="@{/signup}">회원가입</a>
        </th:block>
        <th:block th:if="${currentMember != null}">
            <span class="member-name" th:text="${currentMember.nickname()}">닉네임</span>
            <form method="post" th:action="@{/logout}" class="inline-form">
                <button type="submit" class="button button-ghost">로그아웃</button>
            </form>
        </th:block>
        <a class="button button-ghost" th:href="@{/download}">앱 받기</a>
    </nav>
</header>
</body>
</html>
