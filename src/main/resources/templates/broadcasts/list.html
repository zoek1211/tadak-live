<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('불 켜면 모인다')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container home"
      th:with="burning=${liveBroadcasts.?[onAir]}, burnedOut=${liveBroadcasts.?[!onAir]}">
    <section class="hero">
        <h1>불 켜면 모인다.</h1>
        <p>휴대폰 하나로 불을 피우고, 불가에 둘러앉아 함께 봅니다.</p>
    </section>

    <section class="shelf" aria-labelledby="live-heading">
        <div class="shelf-head">
            <h2 id="live-heading">지금 타는 중</h2>
            <span class="meta" th:text="${#lists.size(burning)} + '곳'">0곳</span>
        </div>

        <p class="empty" th:if="${#lists.isEmpty(burning)}">
            아직 타는 불이 없습니다. <a th:href="@{/live/new}">먼저 불을 피워 보세요.</a>
        </p>

        <ul class="broadcast-grid" th:unless="${#lists.isEmpty(burning)}">
            <li th:each="live : ${burning}">
                <a class="card" th:href="@{/live/{id}(id=${live.id})}">
                    <div class="thumb thumb-live">
                        <span class="thumb-label" aria-hidden="true">방송 화면</span>
                        <span class="badge badge-live thumb-badge">
                            <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 3.2-1.6 4.8-1.6 7.6 0 1.4 1 2.4 2.2 2.4 1.4 0 2.2-1.1 2-2.9 2.3 1.7 3.4 4.1 3.4 6.4A6 6 0 0 1 12 21.5a6 6 0 0 1-6-6c0-4.6 4.6-7.2 6-13.5Z" fill="currentColor"/></svg>
                            <span th:text="${live.status.label}">타는 중</span>
                        </span>
                        <span class="thumb-chip" th:text="'불가에 ' + ${@liveAudience.count(live.id)} + '명'">불가에 0명</span>
                    </div>
                    <strong class="card-title" th:text="${live.title}">제목</strong>
                    <span class="meta">
                        <span th:text="${live.owner != null} ? ${live.owner.nickname} : '소유자 없음'">닉네임</span>
                        ·
                        <time th:text="${#temporals.format(live.startedAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul')}">2026-01-01</time> 시작
                    </span>
                </a>
            </li>
        </ul>
    </section>

    <section class="shelf" aria-labelledby="replay-heading">
        <div class="shelf-head">
            <h2 id="replay-heading">다시 보기</h2>
            <span class="meta">지난 불가의 이야기</span>
        </div>

        <p class="empty" th:if="${#lists.isEmpty(broadcasts)}">
            아직 다시 보기가 없습니다. <a th:href="@{/broadcasts/new}">첫 영상을 올려 보세요.</a>
        </p>

        <ul class="broadcast-grid" th:unless="${#lists.isEmpty(broadcasts)}">
            <li th:each="broadcast : ${broadcasts}">
                <a class="card" th:href="@{/broadcasts/{id}(id=${broadcast.id})}">
                    <div class="thumb thumb-replay">
                        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" stroke="currentColor" stroke-width="1.5"/><path d="M10 8.5v7l5.5-3.5L10 8.5Z" fill="var(--text-soft)"/></svg>
                        <span class="thumb-chip" th:text="${broadcast.videoSource.name() == 'UPLOADED'} ? '올린 영상' : '외부 영상'">올린 영상</span>
                    </div>
                    <strong class="card-title" th:text="${broadcast.title}">제목</strong>
                    <span class="meta">
                        <span th:text="${broadcast.owner != null} ? ${broadcast.owner.nickname} : '소유자 없음'">닉네임</span>
                        ·
                        <time th:text="${#temporals.format(broadcast.registeredAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul')}">2026-01-01</time>
                    </span>
                </a>
            </li>
        </ul>
    </section>

    <section class="shelf" aria-labelledby="out-heading" th:unless="${#lists.isEmpty(burnedOut)}">
        <div class="shelf-head">
            <h2 id="out-heading">꺼진 불</h2>
            <span class="meta">끝난 라이브</span>
        </div>
        <ul class="ended-list">
            <li th:each="live : ${burnedOut}">
                <a th:href="@{/live/{id}(id=${live.id})}" th:text="${live.title}">제목</a>
                <span class="meta">
                    <span class="badge badge-ended" th:text="${live.status.label}">불 꺼짐</span>
                    · <span th:text="${live.owner != null} ? ${live.owner.nickname} : '소유자 없음'">닉네임</span>
                    ·
                    <time th:text="${#temporals.format(live.startedAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul')}">2026-01-01</time>
                </span>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
